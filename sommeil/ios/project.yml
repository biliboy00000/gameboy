# Projet Xcode généré par XcodeGen (https://github.com/yonaskolb/XcodeGen) :
#   brew install xcodegen && cd sommeil/ios && xcodegen && open Somno.xcodeproj
name: Somno
options:
  bundleIdPrefix: fr.diy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Somno:
    type: application
    platform: iOS
    sources:
      - path: Somno
      # l'application web complète (analyse, rapport, modèle) est embarquée telle quelle
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: Somno/Info.plist
      properties:
        CFBundleDisplayName: Somno
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: "Le micro enregistre les sons de la nuit (ronflements) et les échos du sonar ultrasonore. Rien ne quitte l'iPhone."
        NSMotionUsageDescription: "L'accéléromètre et le gyroscope captent la respiration, les battements du cœur et les mouvements à travers le matelas."
        NSCameraUsageDescription: "Mode expérimental : la caméra de profondeur TrueDepth suit le mouvement de la poitrine dans le noir."
        NSHealthShareUsageDescription: "Somno lit vos données de sommeil pour les comparer."
        NSHealthUpdateUsageDescription: "Somno enregistre les phases de sommeil estimées dans Apple Santé."
    entitlements:
      path: Somno/Somno.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.diy.somno
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""   # ← votre équipe (compte Apple gratuit suffisant, voir README)
